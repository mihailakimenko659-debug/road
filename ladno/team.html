<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Ладно · Кафе</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=Caveat:wght@600&display=swap">
<style>
/* Макет как в семейной версии: колонка приложения слева, справа (на широком экране) — «почему так сделано». Мотив — бумажное положение о премировании с подписями и печатью. Цвет продукта — паприка. */
:root{
  --bg:#eef0f6; --surface:#ffffff; --ink:#1b2350; --muted:#5b6286; --line:#d8dbea;
  --on-ink:#ffffff; --on-accent:#2b0c03;
  --accent:#e4572e; --accent-ink:#a63212; --accent-soft:#ffe6dd;
  --parent:#3d55c9; --parent-soft:#e3e8ff;
  --rel:#1f8a6b; --rel-soft:#dcf3ea;
  --ok:#1f8a5b; --warn:#b26a00; --warn-soft:#fff0d9; --bad:#c0392b; --bad-soft:#fde6e3;
  --f-display:"Unbounded","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-hand:"Caveat","Segoe Script","Comic Sans MS",cursive;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10132a; --surface:#1a1e3c; --ink:#eceefb; --muted:#a3a9cc; --line:#2d335c; --on-ink:#10132a;
  --accent:#ff7a50; --accent-ink:#ff9a78; --accent-soft:#3d1d14;
  --parent:#8fa2ff; --parent-soft:#262f63; --rel:#4fd1a5; --rel-soft:#143a31;
  --ok:#4cc38a; --warn:#ffb54d; --warn-soft:#3b2a10; --bad:#ff7a6e; --bad-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10132a; --surface:#1a1e3c; --ink:#eceefb; --muted:#a3a9cc; --line:#2d335c; --on-ink:#10132a;
  --accent:#ff7a50; --accent-ink:#ff9a78; --accent-soft:#3d1d14;
  --parent:#8fa2ff; --parent-soft:#262f63; --rel:#4fd1a5; --rel-soft:#143a31;
  --ok:#4cc38a; --warn:#ffb54d; --warn-soft:#3b2a10; --bad:#ff7a6e; --bad-soft:#3d1c1a; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--parent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.2;text-wrap:balance;margin:0}
p{margin:0}
.shell{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}

/* Шапка */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding-block:12px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-size:20px;letter-spacing:.01em;display:block;line-height:1}
.brand small{color:var(--muted);font-size:12px}
.seal{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-family:var(--f-display);font-weight:700;font-size:18px;box-shadow:inset 0 0 0 3px var(--accent),inset 0 0 0 5px #fff6;transform:rotate(-8deg)}
.top-acts{display:flex;align-items:center;gap:8px;margin-left:auto}
.saved{font-size:12px;color:var(--muted);transition:color .3s}
.saved.flash{color:var(--ok)}
.roles{display:flex;gap:6px;flex-wrap:wrap}
.role{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 8px;cursor:pointer;font-weight:500;display:flex;align-items:center;gap:6px}
.role .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent-ink)}
.role.parent .av{background:var(--parent-soft);color:var(--parent)}
.role .rj{font-size:12.5px;opacity:.75;font-weight:400}
.role[aria-selected="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.roles-label{font-size:12px;color:var(--muted);align-self:center;margin-right:2px}
@media (max-width:520px){.brand small .wide,.role .rj{display:none}.top{position:static}}

/* Раскладка */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;padding-block:18px 0}
.col{min-width:0;display:flex;flex-direction:column;min-height:calc(100vh - 140px)}
#screen{display:flex;flex-direction:column;gap:18px;padding-bottom:24px;flex:1}
aside#why{display:none}
@media (min-width:980px){
  .layout{grid-template-columns:minmax(0,500px) minmax(0,1fr)}
  aside#why{display:block;position:sticky;top:130px;align-self:start}
  .why-inline{display:none}
}

/* Нижние вкладки */
.tabs{position:sticky;bottom:0;z-index:5;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:var(--r) var(--r) 0 0;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{border:0;background:none;padding:8px 2px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);position:relative;min-width:0}
.tab[aria-selected="true"]{color:var(--ink);background:var(--bg)}
.tab .tl{position:relative}
.tab .badge{position:absolute;top:-10px;left:calc(100% - 2px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;font-weight:600}

/* Блоки */
.screen-title{font-size:26px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.block h2{font-size:16px}
.block-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.note,.muted{color:var(--muted)}
.small{font-size:13px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.hint{font-size:13px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.sub{margin-top:-10px}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.3}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.accent{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.locked{background:transparent;border-style:dashed;color:var(--muted)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{border:1px dashed var(--line);background:var(--bg);border-radius:999px;padding:5px 10px;font-size:12.5px;cursor:pointer}
.chip:hover{border-style:solid}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.hot{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent;font-weight:600}
.pill.ok{background:var(--rel-soft);color:var(--rel);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.wait{background:var(--parent-soft);color:var(--parent);border-color:transparent}
button.pill{cursor:pointer;font:inherit;font-size:11.5px}

/* Задания и чек-листы */
.task{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.block h2 + .task,.block .block-head + .task{border-top:0;padding-top:0}
.task-main{min-width:0;display:flex;flex-direction:column;gap:4px}
.task-title{font-weight:600}
.task-meta{font-size:13px;color:var(--muted)}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.task-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.task-pts{font-family:var(--f-display);font-size:15px;color:var(--accent-ink)}
.check{border-top:1px solid var(--line);padding-top:10px}
.block-head + .check{border-top:0;padding-top:0}
.check .task{border:0;padding:0 0 8px}
.check-acts{display:flex;gap:6px;flex-wrap:wrap}
.duties{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.duty{width:100%;text-align:left;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;cursor:pointer}
.duty[disabled]{cursor:default}
.duty .tick{width:20px;height:20px;border-radius:6px;border:2px solid var(--muted);flex:none;position:relative}
.duty .dt{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.duty .dp{flex:none;font-weight:600;color:var(--accent-ink);font-variant-numeric:tabular-nums;font-size:13.5px}
.duty.on .dt>span:first-child{color:var(--muted)}
.duty.on .tick{background:var(--ok);border-color:var(--ok)}
.duty.on .tick::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}

/* Обсуждение спора */
.deal{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.thread{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.thread li{max-width:88%;padding:7px 11px;border-radius:12px;font-size:14px}
.thread li.by-emp{align-self:flex-start;background:var(--accent-soft);border-bottom-left-radius:4px}
.thread li.by-mgr{align-self:flex-end;background:var(--parent-soft);border-bottom-right-radius:4px}
.thread .who{display:block;font-size:11.5px;color:var(--muted)}

/* Премия */
.hero{background:var(--accent-soft);border:1px solid transparent;border-radius:20px;padding:18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.hero .txt{min-width:0;flex:1 1 200px;display:flex;flex-direction:column;gap:6px}
.hero h1{font-size:28px;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.ringbox{position:relative;width:148px;height:148px;flex:none;max-width:100%}
.ringbox svg{display:block}
.ring-bg{fill:none;stroke:var(--surface);stroke-width:13}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:13;stroke-linecap:round;transition:stroke-dashoffset .7s ease}
.ring-num{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-num b{font-family:var(--f-display);font-size:30px;line-height:1}
.ring-num span{font-size:12px;color:var(--muted)}
.crits{display:flex;flex-direction:column}
.crit{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 0;border-top:1px solid var(--line)}
.crit:first-child{border-top:0;padding-top:0}
.crit .mark{width:20px;height:20px;border-radius:50%;margin-top:2px;position:relative;background:var(--rel-soft)}
.crit .mark::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid var(--ok);border-width:0 2px 2px 0;transform:rotate(45deg)}
.crit.bad .mark,.crit.wait .mark,.crit.off .mark{background:var(--bad-soft)}
.crit.bad .mark::after,.crit.wait .mark::after,.crit.off .mark::after{left:5px;top:9px;width:10px;height:0;border-width:2px 0 0;border-color:var(--bad);transform:none}
.crit.wait .mark{background:var(--parent-soft)} .crit.wait .mark::after{border-color:var(--parent)}
.crit.off .mark{background:var(--bg)} .crit.off .mark::after{border-color:var(--muted)}
.crit-main{min-width:0;display:flex;flex-direction:column;gap:4px}
.crit-main b{font-weight:600}
.crit-eff{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ok);font-size:14px}
.crit.bad .crit-eff,.crit.wait .crit-eff{color:var(--bad)}
.crit.off .crit-eff{color:var(--muted);text-decoration:line-through}
.wallet{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.wallet .bal{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.list li:first-child{border-top:0}
.list .d{color:var(--muted);font-size:12.5px}
.list .r{text-align:right;flex:none}
.plus{color:var(--ok);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.minus{color:var(--bad);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.banner{border-radius:12px;padding:12px 14px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;font-size:14px}
.banner.pause{background:var(--parent-soft)}
.banner.warn{background:var(--warn-soft)}
.banner.bad{background:var(--bad-soft)}
.banner.gold{background:var(--accent-soft)}

/* Сводки, цель, спасибо */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;min-width:0}
.stat b{font-family:var(--f-display);font-size:22px;display:block;font-variant-numeric:tabular-nums;font-weight:700}
.stat span{font-size:12px;color:var(--muted)}
button.stat{cursor:pointer}
button.stat:hover{border-color:var(--muted)}
.bars{display:grid;gap:14px}
.bar-row{display:grid;gap:6px}
.bar-top{display:flex;justify-content:space-between;font-size:14px;gap:8px;flex-wrap:wrap}
.bar{height:10px;border-radius:5px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--parent);border-radius:5px}
.bar i.ok{background:var(--ok)}
.meter{position:relative;height:12px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.meter i{display:block;height:100%;border-radius:6px;background:var(--accent);transition:width .6s ease}
.meter i.ok{background:var(--ok)}
.meter b{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1px;border-radius:2px;background:var(--ink)}
.goal{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.thx{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.thx:first-child{border-top:0;padding-top:0}
.thx-head{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;align-items:baseline}
.thx q{font-family:var(--f-hand);font-size:22px;line-height:1.15;quotes:"«" "»"}
.thx .d{color:var(--muted);font-size:12.5px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:0}
.steps li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;position:relative}
.steps li::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--surface);justify-self:center;z-index:1}
.steps li.done::before{background:var(--accent);border-color:var(--accent)}
.steps li:not(:last-child)::after{content:"";position:absolute;left:10px;top:50%;height:100%;width:2px;background:var(--line)}
.steps li.done:not(:last-child)::after{background:var(--accent)}
.steps .d{color:var(--muted);font-size:12.5px}
.people .av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-size:13px;font-weight:600;background:var(--accent-soft);color:var(--accent-ink);flex:none}
.people .av.m{background:var(--parent-soft);color:var(--parent)}
.people li{align-items:center}
.people .who{display:flex;gap:10px;align-items:center;min-width:0}

/* Положение */
.paper{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px 18px;display:flex;flex-direction:column;gap:16px;position:relative}
.paper-head{padding-right:96px}
.paper h2{font-size:18px}
.paper h3{font-size:13.5px;margin-bottom:8px}
.paper .ver{font-size:12px;color:var(--muted);margin-top:4px}
.cls{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.cls>li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px;font-size:14.5px}
.cls>li::before{content:attr(data-n);font-family:var(--f-display);font-size:12px;color:var(--accent-ink);padding-top:2px}
.plist{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px;font-size:13.5px}
.plist li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line);padding-bottom:3px}
.signs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;border-top:1px dashed var(--line);padding-top:14px}
.sign{display:flex;flex-direction:column;gap:2px;min-width:0}
.sign .hand{font-family:var(--f-hand);font-size:26px;line-height:1;color:var(--parent);min-height:28px}
.sign .who{font-size:12px;color:var(--muted);border-top:1px solid var(--muted);padding-top:3px}
.stamp{position:absolute;right:14px;top:16px;transform:rotate(9deg);border:2px solid var(--ok);color:var(--ok);border-radius:8px;padding:2px 8px;font-family:var(--f-display);font-size:11px;letter-spacing:.06em}

/* Почему так */
.why{display:flex;flex-direction:column;gap:12px}
.why-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.why-card .p{font-size:13px;color:var(--bad);font-weight:600}
.why-card .src{font-size:12px;color:var(--muted)}
.why-card .s{font-size:14.5px}
.why-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.why-head h2{font-size:15px}
details.why-inline{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
details.why-inline summary{cursor:pointer;font-weight:600}
details.why-inline[open] summary{margin-bottom:10px}
details.why-inline .why-card{border:0;padding:10px 0;border-top:1px solid var(--line);border-radius:0}
.sol{display:grid;gap:10px}
.future{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.future li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.future li::before{content:"";width:10px;height:10px;margin-top:7px;border-radius:3px;background:var(--accent)}
.hyp{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;padding:1px 7px;border-radius:999px;background:var(--warn-soft);color:var(--warn);vertical-align:1px}

/* Окно формы */
.sheet{position:fixed;inset:0;z-index:20;display:grid;align-items:end;justify-items:center}
.sheet-back{position:absolute;inset:0;background:#0b0e2299}
.sheet-card{position:relative;width:min(520px,100%);max-height:88vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .22s ease}
@media (min-width:640px){.sheet{align-items:center}.sheet-card{border-radius:20px}}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.sheet-card h2{font-size:18px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label,fieldset.fld legend{font-size:13px;font-weight:600}
fieldset.fld{border:0;margin:0;padding:0}
fieldset.fld legend{padding:0;margin-bottom:5px}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%}
.fld textarea{resize:vertical}
.fld.check{flex-direction:row;align-items:center;gap:10px}

.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.switch:checked{background:var(--ok)!important}
.switch:checked::after{left:21px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.segb{position:relative}
.segb input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}

.segb input:focus-visible+span{outline:3px solid var(--parent);outline-offset:2px}
.segb input:disabled+span{opacity:.4}

.photo-ph span{background:var(--surface);padding:2px 8px;border-radius:6px}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end}
.err{color:var(--bad);font-size:13px;min-height:1px}
.err:empty{display:none}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:calc(100% - 32px);width:max-content;box-shadow:0 8px 24px #0004;transition:opacity .25s}
.toast[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- Пример кафе ---------- */

    rules:{ver:2,since:firstNext(-1),chkMin:95,chkCut:20,rateMin:4.7,rateCut:10,maxCut:50,disputeDays:7,allowance:50,notice:30,photoDays:30},
    prem:{base:{dima:6000,sasha:7000,lena:6000,oleg:7000,katya:4000},
      stats:{dima:{d:188,t:196},sasha:{d:186,t:200},lena:{d:241,t:246},oleg:{d:150,t:155},katya:{d:18,t:18}},

    goal:{prize:'Командный ужин за счёт заведения',rate:4.8,chk:95},
    cuts:[
      {id:'c1',who:'dima',clause:'4.2',reason:'Пришёл в 10:22, смена с 10:00. Не предупредил',ev:false,t:tm(2*DAY),status:'active',seen:false},
      {id:'c2',who:'oleg',clause:'4.1',reason:'Пришёл в 8:10, смена с 8:00',ev:false,t:tm(4*DAY),status:'disputed',seen:true,dispute:{text:'Сломался автобус. Я написал Ирине в 7:40 и предупредил, что опоздаю',t:tm(3*DAY)}},
      {id:'c3',who:'lena',clause:'4.1',reason:'Опоздала на 9 минут',ev:false,t:tm(12*DAY),status:'cancelled',seen:true,dispute:{text:'Я ждала инкассатора у входа, Ирина сама попросила',t:tm(12*DAY)},res:{text:'Да, это я попросила. Снижение отменяю',t:tm(11*DAY)}}],
    thanks:[
      {id:uid(),from:'lena',to:'dima',pts:10,msg:'Выручил в час пик: взял мои столики на веранде',t:tm(1*DAY)},
      {id:uid(),from:'dima',to:'katya',pts:10,msg:'Первая неделя, а гости уже хвалят',t:tm(1*DAY)},

      {id:uid(),from:'oleg',to:'katya',pts:5,msg:'Быстро учится: сама разобралась со стоп-листом',t:tm(2*DAY)},

      {id:'r5',title:'Курс бариста: половину оплачивает кафе',pts:900,kind:'Учёба',since:firstNext(-1),next:{pts:1000,from:firstNext(2),told:n-2*DAY}}],

    onb:{who:'katya',mentor:'dima',start:n-2*DAY,pts:20,bonus:50,items:[

      {id:'o6',t:'Разговор с управляющей: что понятно, что сложно',day:5,by:'manager',done:false}]},
    log:[

}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1&&s.people&&s.shift)return s}catch(e){}return null}
let S=load()||seed();
let UI={role:MGR,tab:'today'};
try{Object.assign(UI,JSON.parse(localStorage.getItem(UIKEY))||{})}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(UIKEY,JSON.stringify(UI))}catch(e){}}
function persist(){save();const el=$('#saved');el.textContent='Сохранено';el.classList.add('flash');clearTimeout(persist.t);persist.t=setTimeout(()=>el.classList.remove('flash'),900)}
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2800)}
function commit(msg){persist();render();if(msg)toast(msg)}

/* ---------- Помощники ---------- */
const person=id=>S.people.find(p=>p.id===id);
const nm=id=>person(id)?person(id).name:'';
const mgr=()=>person(MGR);
const isMgr=()=>UI.role===MGR;
const STAFF=()=>S.people.filter(p=>p.id!==MGR);
const g=(p,m,f)=>p&&p.f?f:m;
const clause=id=>CUTS.find(c=>c.id===id);
const cutById=id=>S.cuts.find(c=>c.id===id);
const listById=id=>S.shift.find(l=>l.id===id);
const doneOf=l=>l.items.filter(i=>i.done);
const valOf=l=>doneOf(l).reduce((s,i)=>s+i.pts,0);
const pending=w=>S.shift.filter(l=>l.who===w&&l.status!=='accepted').reduce((s,l)=>s+valOf(l),0);
const reserved=w=>S.requests.filter(r=>r.who===w&&r.status==='pending').reduce((s,r)=>s+r.pts,0);
const free=w=>Math.max(0,(S.wallet[w]||0)-reserved(w));
const given=w=>S.thanks.filter(t=>t.from===w&&inMonth(t.t)).reduce((s,t)=>s+t.pts,0);
const allowLeft=w=>Math.max(0,S.rules.allowance-given(w));
const teamChk=()=>{let d=0,t=0;STAFF().forEach(p=>{const s=S.prem.stats[p.id];if(s){d+=s.d;t+=s.t}});return t?d/t:1};
const perShift=w=>{const r=TPL[person(w).role];return r?r.open[1].length+r.close[1].length:8};
function addLog(o){S.log.unshift(Object.assign({id:uid(),t:Date.now(),delta:0,who:null},o))}
function empty(m){return `<p class="empty">${m}</p>`}
function applyDue(){
  let ch=false;
  S.rewards.forEach(r=>{if(r.next&&r.next.from<=Date.now()){addLog({kind:'rules',text:`Новая цена вступила в силу: «${r.title}» — ${fmt(r.next.pts)}`});r.pts=r.next.pts;r.since=r.next.from;delete r.next;ch=true}});
  if(ch)save();
}
function forecast(w,extra){
  const R=S.rules,st=S.prem.stats[w]||{d:0,t:0},base=S.prem.base[w]||0,chk=st.t?st.d/st.t:1;
  const chkOk=chk*100>=R.chkMin-1e-9,rOk=S.prem.rating>=R.rateMin-1e-9;
  let cut=(chkOk?0:R.chkCut)+(rOk?0:R.rateCut),disp=0;
  S.cuts.forEach(c=>{if(c.who!==w||c.status==='cancelled'||!inMonth(c.t))return;const p=clause(c.clause).pct;cut+=p;if(c.status==='disputed')disp+=p});
  cut+=extra||0;
  const p=100-Math.min(cut,R.maxCut),pWin=100-Math.min(cut-disp,R.maxCut);
  return {p,sum:Math.round(base*p/100),base,chk,chkOk,rOk,cut,disp,pWin,sumWin:Math.round(base*pWin/100),capped:cut>R.maxCut};
}
function chkNeed(w){const st=S.prem.stats[w],k=S.rules.chkMin/100;return Math.max(0,Math.ceil((k*st.t-st.d)/(1-k)-1e-9))}
function chkSpare(w){const st=S.prem.stats[w],k=S.rules.chkMin/100;return Math.max(0,Math.floor(st.d/k-st.t+1e-9))}
function ring(p,size){
  const r=60,c=2*Math.PI*r,off=c*(1-clamp(p));
  return `<svg viewBox="0 0 148 148" width="${size}" height="${size}" aria-hidden="true"><circle cx="74" cy="74" r="${r}" class="ring-bg"/><circle cx="74" cy="74" r="${r}" class="ring-fg" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 74 74)"/></svg>`;
}
function hist(items,showWho){
  if(!items.length)return empty('Пока пусто.');
  return `<ul class="list">${items.map(l=>`<li><span>${showWho&&l.who?`<b>${esc(nm(l.who))}</b>: `:''}${esc(l.text)}<br><span class="d">${ago(l.t)}</span></span>${l.delta?`<span class="${l.delta>0?'plus':'minus'}">${l.delta>0?'+':'−'}${fmt(Math.abs(l.delta))}</span>`:''}</li>`).join('')}</ul>`;
}

/* ---------- Общие куски ---------- */
function listBlock(l){
  const dn=doneOf(l).length,all=l.items.length,ed=l.status==='open'||l.status==='returned',m=mgr();
  const st={open:'',submitted:`<span class="pill wait">сдан, ждёт ${esc(m.gen)}</span>`,accepted:'<span class="pill ok">принят</span>',returned:'<span class="pill warn">вернули</span>'}[l.status];

function badge(tab){
  if(isMgr()){if(tab==='today')return S.shift.filter(l=>l.status==='submitted').length+S.cuts.filter(c=>c.status==='disputed').length+S.requests.filter(r=>r.status==='pending').length;return 0}
  const w=UI.role;
  if(tab==='premium')return S.cuts.filter(c=>c.who===w&&!c.seen).length;
  if(tab==='shift')return S.shift.filter(l=>l.who===w&&l.status==='returned').length;
  return 0;
}
function render(){
  applyDue();
  if(!SWITCH.includes(UI.role))UI.role=MGR;
  const tabs=TABS[isMgr()?'mgr':'emp'];
  if(UI.tab!=='solutions'&&UI.tab!=='rules'&&!tabs.some(t=>t[0]===UI.tab))UI.tab=tabs[0][0];
  $('#roles').innerHTML=`<span class="roles-label">Смотреть как:</span>`+SWITCH.map(id=>{const p=person(id);return `<button class="role ${id===MGR?'parent':''}" role="tab" aria-selected="${UI.role===id}" data-act="role" data-role="${id}"><span class="av" aria-hidden="true">${esc(p.name[0])}</span>${esc(p.name)}<span class="rj"> · ${esc(p.job)}</span></button>`}).join('');
  $('#screen').innerHTML=UI.tab==='solutions'?vSolutions():(isMgr()?MV:EV)[UI.tab](UI.role)+whyInline();
  $('#tabs').innerHTML=tabs.map(([id,l])=>{const b=badge(id);return `<button class="tab" role="tab" aria-selected="${UI.tab===id}" data-act="tab" data-tab="${id}"><span class="tl">${l}${b?`<span class="badge">${b}</span>`:''}</span></button>`}).join('');
  $('#why').innerHTML=whyAside();
}

/* ---------- Окно формы ---------- */
let onSubmit=null;
function sheet(title,body,ok,fn,info){$('#sheet-title').textContent=title;$('#sheet-body').innerHTML=body;$('#sheet-ok').textContent=ok;$('#sheet-no').hidden=!!info;$('#sheet-err').textContent='';onSubmit=fn;$('#sheet').hidden=false;setTimeout(()=>{const f=$('#sheet-body').querySelector('input:not([type=radio]),select,textarea');(f||$('#sheet-ok')).focus()},40)}
function closeSheet(){$('#sheet').hidden=true;onSubmit=null}
$('#sheet-form').addEventListener('submit',e=>{e.preventDefault();if(!onSubmit)return;const f=Object.fromEntries(new FormData(e.target));const err=onSubmit(f);if(err){$('#sheet-err').textContent=err;return}closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
const fld=(id,label,input)=>`<div class="fld"><label for="${id}">${label}</label>${input}</div>`;
const numIn=(id,name,val,min,max)=>`<input id="${id}" name="${name}" type="number" inputmode="numeric" min="${min}" max="${max}" value="${val}">`;
const int=v=>{const n=Math.round(Number(v));return Number.isFinite(n)?n:NaN};
function cutPreview(){
  const el=$('#f-prev');if(!el)return;
  const w=$('#f-who').value,c=clause($('#f-cl').value),a=forecast(w),b=forecast(w,c.pct),p=person(w);
  el.innerHTML=`<span>Премия ${esc(p.gen)} за ${monthName()}: <b>${a.p}% → ${b.p}%</b> (${rub(a.sum)} → ${rub(b.sum)})${b.capped?`. По п. 5.2 больше чем на ${S.rules.maxCut}% снизить нельзя`:''}</span>`;
}
document.addEventListener('input',e=>{if(e.target.closest&&e.target.closest('#sheet-body'))cutPreview()});
document.addEventListener('change',e=>{if(e.target.closest&&e.target.closest('#sheet-body'))cutPreview()});

/* ---------- Действия ---------- */
function acceptList(l){
  const dn=doneOf(l),v=valOf(l),st=S.prem.stats[l.who];
  S.wallet[l.who]=(S.wallet[l.who]||0)+v;if(st){st.d+=dn.length;st.t+=l.items.length}
  l.status='accepted';addLog({kind:'shift',who:l.who,text:`Чек-лист принят: ${l.title} (${dn.length} из ${l.items.length})`,delta:v});return v;
}
const ACT={
  role:d=>{const was=isMgr();UI.role=d.role;if(UI.tab!=='solutions'&&was!==isMgr())UI.tab=TABS[isMgr()?'mgr':'emp'][0][0];commit();scrollTo(0,0)},
  tab:d=>{UI.tab=d.tab;commit();scrollTo(0,0)},
  solutions:()=>{UI.tab='solutions';commit();scrollTo(0,0)},
  goto:d=>{UI.role=d.role;UI.tab=d.tab;commit();scrollTo(0,0)},
  closeSheet,
  tick:d=>{
    const l=listById(d.l),i=l.items.find(x=>x.id===d.i),m=mgr();
    if(i.done){i.done=false;i.photoOk=false;commit('Отметка снята');return}
    if(i.photo){
      sheet('Фотоотчёт',`<p class="small"><b>${esc(i.t)}</b> · +${pts(i.pts)}</p><div class="photo-ph" aria-hidden="true"><span>Здесь откроется камера</span></div>
        <div class="fld check"><input id="f-ph" name="ph" type="checkbox" class="switch"><label for="f-ph">Фото приложено</label></div>
        <p class="hint">В прототипе камеры нет: достаточно включить переключатель. Геолокация не записывается. Фото видят только вы и ${esc(m.name)}, оно удаляется через ${days(S.rules.photoDays)}, если по нему нет спора.</p>`,
        'Отметить',f=>{if(!f.ph)return 'Для этого пункта нужно фото: включите «Фото приложено».';i.done=true;i.photoOk=true;commit(`+${pts(i.pts)}. Зачислятся, когда ${m.name} примет чек-лист`)});
      return;
    }
    i.done=true;commit(`+${pts(i.pts)}. Зачислятся, когда ${m.name} примет чек-лист`);
  },
  submitList:d=>{
    const l=listById(d.l),miss=l.items.filter(i=>!i.done),m=mgr();
    const go=r=>{l.status='submitted';l.sub=Date.now();l.reason=r||'';l.note='';commit(`Сдано. ${m.name} проверит и зачислит баллы`)};
    if(!miss.length){go('');return}
    sheet('Сдать не всё?',`<p class="small">Не отмечено: ${miss.map(i=>'«'+esc(i.t)+'»').join(', ')}. Эти пункты пойдут в процент чек-листов (п. 3.1).</p>`+fld('f-r','Почему не получилось',`<input id="f-r" name="r" maxlength="80" placeholder="Например: закончились салфетки, сказал(а) Ирине">`),'Сдать',f=>{const r=(f.r||'').trim();if(!r)return 'Напишите причину в двух словах: так управляющей проще решить.';go(r)});
  },
  accept:d=>{const l=listById(d.l),v=acceptList(l);commit(`Принято. ${nm(l.who)} получает +${fmt(v)}`)},
  acceptAll:()=>{const s=S.shift.filter(l=>l.status==='submitted');s.forEach(acceptList);commit(`Принято чек-листов: ${s.length}`)},
  ret:d=>{const l=listById(d.l),p=person(l.who);sheet('Вернуть чек-лист',fld('f-note','Что поправить',`<input id="f-note" name="note" maxlength="80" placeholder="Например: на фото не видно дат на заготовках">`)+`<p class="hint">Без снижения премии: ${esc(p.name)} поправит и сдаст снова.</p>`,'Вернуть',f=>{const n=(f.note||'').trim();if(!n)return 'Напишите, что поправить.';l.status='returned';l.note=n;commit('Вернули с пояснением')})},
  photos:d=>{const l=listById(d.l);sheet('Фото: '+nm(l.who)+', '+l.title.toLowerCase(),l.items.filter(i=>i.photo&&i.photoOk).map(i=>`<div class="fld"><div class="photo-ph" aria-hidden="true"><span>фото-заглушка</span></div><span class="hint">${esc(i.t)}</span></div>`).join('')+`<p class="hint">В прототипе вместо фото — заглушка. Геолокации нет. Фото удалится через ${days(S.rules.photoDays)}, если по нему нет спора.</p>`,'Закрыть',()=>{},true)},
  onb:d=>{
    const o=S.onb,i=o.items.find(x=>x.id===d.id),k=person(o.who);if(i.done)return;i.done=true;
    if(i.by==='mentor'){S.wallet[o.mentor]+=o.pts;addLog({kind:'mentor',who:o.mentor,text:`Наставник для ${k.gen}: «${i.t}»`,delta:o.pts})}
    else addLog({kind:'mentor',who:o.who,text:`Разговор с управляющей о первой неделе`});
    if(o.items.every(x=>x.done)){S.wallet[o.who]+=o.bonus;addLog({kind:'mentor',who:o.who,text:'Первая неделя пройдена',delta:o.bonus});commit(`Первая неделя пройдена! ${k.name} получает +${o.bonus}`);return}
    commit(i.by==='mentor'?`+${pts(o.pts)} за помощь новичку`:'Отмечено');
  },
  thank:()=>{
    const w=UI.role,left=allowLeft(w),others=S.people.filter(p=>p.id!==w),def=Math.min(10,left);
    if(!left){toast('В этом месяце баллы для «спасибо» закончились. Новые будут 1-го числа');return}
    sheet('Сказать спасибо',fld('f-to','Кому',`<select id="f-to" name="to">${others.map(p=>`<option value="${p.id}">${esc(p.name)}, ${esc(p.job)}</option>`).join('')}</select>`)+
      `<fieldset class="fld"><legend>Сколько баллов</legend><div class="seg">${[5,10,15,20].map(v=>`<label class="segb"><input type="radio" name="pts" value="${v}" ${v===def?'checked':''} ${v>left?'disabled':''}><span>${v}</span></label>`).join('')}</div></fieldset>`+
      fld('f-msg','За что',`<input id="f-msg" name="msg" maxlength="80" placeholder="Например: выручил в час пик">`)+
      `<div class="row">${THX_CHIPS.map(c=>`<button type="button" class="chip" data-act="msgChip" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>`+
      `<p class="hint">Осталось ${pts(left)} на ${monthName()}. Сообщение увидит вся команда.</p>`,
      'Отправить',f=>{const to=f.to,v=int(f.pts),msg=(f.msg||'').trim();if(!person(to)||to===w)return 'Выберите коллегу.';if(!msg)return 'Напишите пару слов: за что спасибо.';if(!(v>=1&&v<=allowLeft(w)))return `Можно не больше ${pts(allowLeft(w))}.`;
        S.thanks.unshift({id:uid(),from:w,to,pts:v,msg,t:Date.now()});S.wallet[to]=(S.wallet[to]||0)+v;
        addLog({kind:'thanks',who:to,text:`Спасибо от ${person(w).gen}: «${msg}»`,delta:v});commit(`Спасибо отправлено: ${person(to).dat} +${fmt(v)}`)});
  },
  msgChip:d=>{const i=$('#f-msg');if(i){i.value=d.v;i.focus()}},
  buy:d=>{
    const r=S.rewards.find(x=>x.id===d.id),w=UI.role,m=mgr();if(free(w)<r.pts)return;
    sheet('Взять награду',`<p><b>${esc(r.title)}</b> — ${pts(r.pts)}</p>`+fld('f-note','Когда удобно (по желанию)',`<input id="f-note" name="note" maxlength="60" placeholder="Например: суббота, утро">`)+`<p class="hint">Баллы отложатся, пока ${esc(m.name)} не подтвердит. Если она откажет, баллы вернутся.</p>`,
      'Попросить',f=>{if(free(w)<r.pts)return 'Не хватает баллов.';S.requests.push({id:uid(),who:w,rid:r.id,title:r.title,pts:r.pts,note:(f.note||'').trim(),status:'pending',t:Date.now()});commit(`Просьба отправлена. ${m.name} увидит её на экране «Сегодня»`)});
  },
  reqOk:d=>{const r=S.requests.find(x=>x.id===d.id);r.status='done';S.wallet[r.who]=Math.max(0,S.wallet[r.who]-r.pts);addLog({kind:'reward',who:r.who,text:'Награда: '+r.title,delta:-r.pts});commit(`Выдано. У ${person(r.who).gen} списано ${pts(r.pts)}`)},
  reqNo:d=>{const r=S.requests.find(x=>x.id===d.id);sheet('Отказать',fld('f-note','Причина',`<input id="f-note" name="note" maxlength="80" placeholder="Например: в субботу банкет, давай другой день">`)+'<p class="hint">Причину увидит сотрудник. Баллы вернутся.</p>','Отказать',f=>{const t=(f.note||'').trim();if(!t)return 'Напишите причину.';r.status='declined';r.reason=t;addLog({kind:'reward',who:r.who,text:`Отказ: ${r.title}. «${t}». Баллы вернулись`});commit('Ответ отправлен, баллы вернулись')})},
  newCut:()=>{
    const R=S.rules;
    sheet('Снижение премии',fld('f-who','Сотрудник',`<select id="f-who" name="who">${STAFF().map(p=>`<option value="${p.id}">${esc(p.name)}, ${esc(p.job)}</option>`).join('')}</select>`)+
      fld('f-cl','Пункт положения',`<select id="f-cl" name="cl">${CUTS.map(c=>`<option value="${c.id}">п. ${c.id} · ${esc(c.t)} · −${c.pct}%</option>`).join('')}</select>`)+
      fld('f-reason','Что случилось (обязательно)',`<textarea id="f-reason" name="reason" rows="2" maxlength="140" placeholder="Например: пришёл в 10:22, смена с 10:00"></textarea>`)+
      `<div class="fld check"><input id="f-ev" name="ev" type="checkbox" class="switch"><label for="f-ev">Фото или запись приложены (по желанию)</label></div>`+
      `<div class="banner gold small" id="f-prev"></div>`+
      `<p class="hint">Сумму в рублях здесь не вписать: денежные штрафы запрещены (ст. 192 ТК РФ). Сотрудник сразу увидит запись и сможет оспорить её в течение ${days(R.disputeDays)}.</p>`,
      'Записать',f=>{const w=f.who,c=clause(f.cl),r=(f.reason||'').trim(),p=person(w);if(!p||!c)return 'Выберите сотрудника и пункт.';
        if(!r)return 'Напишите, что случилось. Без причины снижение не записывается (п. 5.1).';
        if(forecast(w).cut>=R.maxCut)return `Премия ${p.gen} уже снижена на ${R.maxCut}%, больше нельзя (п. 5.2). Можно сделать замечание: это законное взыскание по ст. 192 ТК РФ.`;
        S.cuts.unshift({id:uid(),who:w,clause:c.id,reason:r,ev:!!f.ev,t:Date.now(),status:'active',seen:false});
        addLog({kind:'premium',who:w,text:`Снижение премии −${c.pct}%, п. ${c.id}: ${c.t.toLowerCase()}. «${r}»`});
        commit(`Записано. ${p.name} уже видит это и может оспорить`)});
    cutPreview();
  },
  noFine:()=>sheet('Штрафа в рублях здесь нет',`<p class="small">Денежные штрафы работникам запрещены. В ст. 192 ТК РФ закрытый список взысканий: замечание, выговор, увольнение. За штраф работодатель отвечает по ст. 5.27 КоАП.</p>
    <p class="small">Законный путь — снизить премию за нарушение, если это заранее записано в положении о премировании (письмо Роструда от 18.12.2014 № 3251-6-1). Поэтому здесь есть только «Записать снижение премии».</p>
    <p class="small">В 2021 году 57% опрошенных не знали, что штрафы запрещены (Работа.ру, Lenta.ru, 22.11.2021).</p>
    <p class="hint">Источники: Моё дело; Главкнига, 06.08.2024. Это не юридическая консультация.</p>`,'Понятно',()=>{},true),
  dispute:d=>{
    const c=cutById(d.id),cl=clause(c.clause),m=mgr();
    sheet('Оспорить снижение',`<div class="deal"><p class="small"><b>п. ${cl.id}: ${esc(cl.t.toLowerCase())}, −${cl.pct}%</b><br>«${esc(c.reason)}»</p></div>`+
      fld('f-note','Почему вы не согласны',`<textarea id="f-note" name="note" rows="3" maxlength="200" placeholder="Например: предупредил заранее, есть сообщение в чате смены"></textarea>`)+
      `<p class="hint">${esc(m.name)} ответит с комментарием. Пока спор не решён, в прогнозе видны оба варианта.</p>`,
      'Отправить',f=>{const t=(f.note||'').trim();if(!t)return 'Напишите, почему вы не согласны.';c.status='disputed';c.dispute={text:t,t:Date.now()};addLog({kind:'dispute',who:c.who,text:`${nm(c.who)} ${g(person(c.who),'оспорил','оспорила')} снижение по п. ${cl.id}: «${t}»`});commit(`Спор отправлен. ${m.name} увидит его на экране «Сегодня»`)});
  },
  resolve:d=>{
    const c=cutById(d.id),cl=clause(c.clause),p=person(c.who),keep=d.res==='keep';
    sheet(keep?'Оставить снижение':'Отменить снижение',`<div class="deal"><p class="small"><b>${esc(p.name)} · п. ${cl.id}, −${cl.pct}%</b><br>«${esc(c.reason)}»</p>${c.dispute?`<ul class="thread"><li class="by-emp"><span class="who">${esc(p.name)}</span>${esc(c.dispute.text)}</li></ul>`:''}</div>`+
      fld('f-note',`Комментарий для ${esc(p.gen)}`,`<textarea id="f-note" name="note" rows="2" maxlength="160" placeholder="${keep?'Например: в чат написал уже после начала смены':'Например: да, предупредил заранее, отменяю'}"></textarea>`)+
      `<p class="hint">${keep?'Снижение останется. Сотрудник увидит ваш ответ, а в истории сохранятся оба мнения.':'Премия вернётся к прежнему проценту. Запись останется в истории как отменённая.'}</p>`,
      keep?'Оставить':'Отменить снижение',f=>{const t=(f.note||'').trim();if(!t)return 'Напишите комментарий: решение без объяснения не принимается.';
        c.status=keep?'confirmed':'cancelled';c.res={text:t,t:Date.now()};c.seen=false;
        addLog({kind:'premium',who:c.who,text:keep?`Снижение по п. ${cl.id} оставлено после спора: «${t}»`:`Снижение по п. ${cl.id} отменено: «${t}»`});
        commit(keep?'Снижение оставлено, ответ отправлен':`Снижение отменено. Премия ${p.gen}: ${forecast(c.who).p}%`)});
  },
  export:()=>toast('Это пример: в настоящем продукте здесь будет файл для бухгалтерии с премиями и причинами'),
  priceChange:()=>{
    let eff=firstNext(1);if(eff-Date.now()<S.rules.notice*DAY)eff=firstNext(2);
    sheet('Новая цена награды',fld('f-r','Награда',`<select id="f-r" name="r">${S.rewards.map(r=>`<option value="${r.id}">${esc(r.title)} · сейчас ${fmt(r.pts)}</option>`).join('')}</select>`)+fld('f-p','Новая цена, баллов',numIn('f-p','p',100,1,100000))+
      `<p class="hint">По п. 6.2 новая цена начнёт действовать ${dstr(eff)}, не раньше чем через ${days(S.rules.notice)}. Команда увидит объявление сразу, а до этой даты награду можно взять по старой цене.</p>`,
      'Объявить',f=>{const r=S.rewards.find(x=>x.id===f.r),p=int(f.p);if(!r)return 'Выберите награду.';if(!(p>=1&&p<=100000))return 'Цена: от 1 до 100 000 баллов.';if(p===r.pts)return 'Это и есть текущая цена.';
        r.next={pts:p,from:eff,told:Date.now()};addLog({kind:'rules',text:`Объявлена новая цена: «${r.title}» — ${fmt(p)} с ${dstr(eff)}`});commit('Объявлено. Новая цена начнёт действовать '+dstr(eff))});
  },
  reset:()=>sheet('Вернуть пример к началу?','<p class="small">Все изменения в этом браузере пропадут, и пример кафе начнётся заново.</p>','Вернуть',()=>{S=seed();UI={role:MGR,tab:'today'};commit('Пример восстановлен')})
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const fn=ACT[b.dataset.act];if(fn){e.preventDefault();fn(b.dataset,b)}});
render();
})();
</script>

</body></html>
