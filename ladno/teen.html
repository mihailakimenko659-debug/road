<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Ладно · Подработка</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=Caveat:wght@600&display=swap">
<style>
/* Макет как в «Ладно · Семья»: колонка приложения слева, справа (на широком экране) — «почему так сделано». Акцент — лайм: первые деньги, «зелёный свет» от мамы. */
:root{
  --bg:#eef0f6; --surface:#ffffff; --ink:#1b2350; --muted:#5b6286; --line:#d8dbea;
  --on-ink:#ffffff;
  --accent:#5fa31a; --accent-ink:#3b6b0c; --accent-soft:#e6f5d2; --on-accent:#112200;
  --parent:#3d55c9; --parent-soft:#e3e8ff;
  --rel:#1f8a6b; --rel-soft:#dcf3ea;
  --ok:#1f8a5b; --warn:#b26a00; --warn-soft:#fff0d9; --bad:#c0392b; --bad-soft:#fde6e3;
  --f-display:"Unbounded","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-hand:"Caveat","Segoe Script","Comic Sans MS",cursive;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10132a; --surface:#1a1e3c; --ink:#eceefb; --muted:#a3a9cc; --line:#2d335c; --on-ink:#10132a;
  --accent:#9bd94d; --accent-ink:#b6e978; --accent-soft:#24361a; --on-accent:#112200;
  --parent:#8fa2ff; --parent-soft:#262f63; --rel:#4fd1a5; --rel-soft:#143a31;
  --ok:#4cc38a; --warn:#ffb54d; --warn-soft:#3b2a10; --bad:#ff7a6e; --bad-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10132a; --surface:#1a1e3c; --ink:#eceefb; --muted:#a3a9cc; --line:#2d335c; --on-ink:#10132a;
  --accent:#9bd94d; --accent-ink:#b6e978; --accent-soft:#24361a; --on-accent:#112200;
  --parent:#8fa2ff; --parent-soft:#262f63; --rel:#4fd1a5; --rel-soft:#143a31;
  --ok:#4cc38a; --warn:#ffb54d; --warn-soft:#3b2a10; --bad:#ff7a6e; --bad-soft:#3d1c1a; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--parent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.2;text-wrap:balance;margin:0}
p{margin:0}
.shell{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}

/* Шапка */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding-block:12px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-size:20px;letter-spacing:.01em;display:block;line-height:1}
.brand small{color:var(--muted);font-size:12px;display:block;margin-top:3px;line-height:1.25}
.seal{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-family:var(--f-display);font-weight:700;font-size:18px;box-shadow:inset 0 0 0 3px var(--accent),inset 0 0 0 5px #fff6;transform:rotate(-8deg)}
.top-acts{display:flex;align-items:center;gap:6px;flex:none}
.saved{font-size:12px;color:var(--muted);transition:color .3s;margin-right:4px}
.saved.flash{color:var(--ok)}
@media (max-width:560px){.saved{display:none}}
@media (max-width:420px){.brand b{font-size:18px}.brand small{font-size:11.5px}.top-acts .btn.sm{padding:6px 9px;font-size:12.5px}}
.roles{display:flex;gap:6px;flex-wrap:wrap}
.role{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:500;display:flex;align-items:center;gap:6px}
.role .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent-ink)}
.role.parent .av{background:var(--parent-soft);color:var(--parent)}
.role.client .av{background:var(--rel-soft);color:var(--rel)}
.role[aria-selected="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.roles-label{font-size:12px;color:var(--muted);align-self:center;margin-right:2px}

/* Раскладка */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;padding-block:18px 0}
.col{min-width:0;display:flex;flex-direction:column;min-height:calc(100vh - 140px)}
#screen{display:flex;flex-direction:column;gap:18px;padding-bottom:24px;flex:1;min-width:0}
#screen.big{font-size:16.5px}
#screen.big .btn{font-size:15.5px}
#screen.big .btn.sm{font-size:14.5px;padding:8px 13px}
aside#why{display:none}
@media (min-width:980px){
  .layout{grid-template-columns:minmax(0,500px) minmax(0,1fr)}
  aside#why{display:block;position:sticky;top:130px;align-self:start}
  .why-inline{display:none}
}

/* Нижние вкладки и «Позвонить маме» */
.tabs{position:sticky;bottom:0;z-index:5;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:var(--r) var(--r) 0 0;display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{border:0;background:none;padding:8px 4px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);position:relative}
.tab[aria-current="page"]{color:var(--ink);background:var(--bg)}
.tab .badge{position:absolute;top:3px;right:calc(50% - 34px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;font-weight:600}
.callbar{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ok);background:transparent;color:var(--ok);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-weight:600;cursor:pointer}
.callbar svg{width:18px;height:18px;flex:none}
.callbar:hover{background:var(--rel-soft)}

/* Блоки */
.screen-title{font-size:26px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.block h2{font-size:16px}
.block-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.note,.muted{color:var(--muted)}
.small{font-size:13px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.hint{font-size:13px;color:var(--muted)}
.src{font-size:12px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.warnline{color:var(--bad);font-size:13px;font-weight:500}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;color:inherit;display:inline-block;line-height:1.4}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.accent{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{border:1px dashed var(--line);background:var(--bg);border-radius:999px;padding:5px 10px;font-size:12.5px;cursor:pointer}
.chip:hover{border-style:solid}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.hot{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent;font-weight:600}
.pill.ok{background:var(--rel-soft);color:var(--rel);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.wait{background:var(--parent-soft);color:var(--parent);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}

/* Задания */
.task{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.task-main{min-width:0;display:flex;flex-direction:column;gap:4px}
.task-title{font-weight:600}
.task-meta{font-size:13px;color:var(--muted)}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.task-side{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none;text-align:right}
.task-pts{font-family:var(--f-display);font-size:15px;color:var(--accent-ink);white-space:nowrap}
.jobs{display:flex;flex-direction:column}
.jobs>.job{padding:14px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;min-width:0}
.jobs>.job:first-child{border-top:0;padding-top:0}
.jobs>.job:last-child{padding-bottom:0}
.rcheck{list-style:none;margin:0;padding:10px 12px;display:grid;gap:4px;font-size:13.5px;background:var(--bg);border-radius:10px}
.rcheck:empty{display:none}
.rcheck li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:6px;align-items:start}
.rcheck li::before{content:"✓";font-weight:700;color:var(--ok);text-align:center}
.rcheck li.warn::before{content:"!";color:var(--warn)}
.rcheck li.bad{color:var(--bad);font-weight:500}
.rcheck li.bad::before{content:"×";color:var(--bad)}

/* Торг и переписка */
.thread{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.thread li{max-width:88%;padding:7px 11px;border-radius:12px;font-size:14px;overflow-wrap:anywhere}
.thread li.by-teen{align-self:flex-start;background:var(--accent-soft);border-bottom-left-radius:4px}
.thread li.by-client{align-self:flex-end;background:var(--rel-soft);border-bottom-right-radius:4px}
.thread li.by-parent{align-self:flex-end;background:var(--parent-soft);border-bottom-right-radius:4px}
.thread li.by-sys{align-self:center;max-width:100%;background:none;color:var(--muted);font-size:12.5px;padding:0 6px;text-align:center}
.thread li b{font-weight:600}
.thread .who{display:block;font-size:11.5px;color:var(--muted)}
.seen{font-size:12px;color:var(--parent);display:flex;align-items:center;gap:6px}
.seen svg{width:14px;height:14px;flex:none}
details.conv{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
details.conv summary{cursor:pointer;font-weight:600;font-size:14px}
details.conv[open] summary{margin-bottom:10px}

/* Цель и заработок */
.hero{background:var(--accent-soft);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.hero h1{font-size:24px}
.hero .big{font-family:var(--f-display);font-size:26px;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.hero .big span{font-family:var(--f-body);font-size:14px;color:var(--muted);font-weight:500}
.meter{height:16px;border-radius:8px;background:var(--surface);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.meter i{display:block;height:100%;background:var(--accent);border-radius:8px;transition:width .7s ease}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.list li:first-child{border-top:0}
.list .d{color:var(--muted);font-size:12.5px}
.list .right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none;text-align:right}
.plus{color:var(--ok);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.banner{border-radius:12px;padding:12px 14px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;font-size:14px}
.banner.warn{background:var(--warn-soft)}
.banner.bad{background:var(--bad-soft)}
.banner.gold{background:var(--accent-soft)}
.banner.info{background:var(--parent-soft)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat b{font-family:var(--f-display);font-size:20px;display:block;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:12px;color:var(--muted)}
@media (max-width:420px){.stat{padding:9px 10px}.stat b{font-size:16px}}
.bar{height:10px;border-radius:5px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar i.over{background:var(--bad)}
.bar-top{display:flex;justify-content:space-between;font-size:14px;gap:8px}

/* Резюме и отзывы */
.stars{color:var(--warn);letter-spacing:1px;white-space:nowrap}
.stars .off{color:var(--line)}
.review{background:var(--rel-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.review .who{font-size:12px;color:var(--rel);font-weight:600;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.review q{font-family:var(--f-hand);font-size:22px;line-height:1.2;quotes:"«" "»"}
.reviews{display:grid;gap:8px}
.cv-head{display:flex;gap:14px;align-items:center}
.cv-av{width:56px;height:56px;flex:none;border-radius:50%;background:var(--accent);color:var(--on-accent);font-family:var(--f-display);font-weight:700;font-size:24px;display:grid;place-items:center;transform:rotate(-6deg)}
.cv .stats .stat{background:var(--bg)}

/* Круг доверия */
.members{display:flex;flex-direction:column}
.member{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.members>.member:first-child{border-top:0;padding-top:0}
.member .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;background:var(--rel-soft);color:var(--rel)}
.member .av.wait{background:var(--bg);color:var(--muted);border:1.5px dashed var(--line)}
.member .av.me{background:var(--parent-soft);color:var(--parent)}
.member .av.teen{background:var(--accent-soft);color:var(--accent-ink)}
.member-main{min-width:0;display:flex;flex-direction:column;gap:4px}
.linkbox{display:flex;gap:6px;align-items:center}
.linkbox input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:13px}

/* Правила */
.paper{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px 18px;display:flex;flex-direction:column;gap:14px;position:relative;min-width:0}
.paper h2{font-size:18px;padding-right:118px}
.paper .ver{font-size:12px;color:var(--muted)}
.clauses{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:10px}
.clauses li{padding-left:4px}
.clauses li::marker{font-family:var(--f-display);font-size:13px;color:var(--accent-ink)}
.signs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;border-top:1px dashed var(--line);padding-top:14px}
.sign{display:flex;flex-direction:column;gap:2px;min-width:0}
.sign .hand{font-family:var(--f-hand);font-size:26px;line-height:1;color:var(--parent);min-height:28px}
.sign .who{font-size:12px;color:var(--muted);border-top:1px solid var(--muted);padding-top:3px}
.stamp{position:absolute;right:14px;top:14px;transform:rotate(9deg);border:2px solid var(--ok);color:var(--ok);border-radius:8px;padding:2px 8px;font-family:var(--f-display);font-size:11px;letter-spacing:.06em}
.stamp.no{border-color:var(--warn);color:var(--warn)}
.setting{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.setting:first-of-type{border-top:0}
.setting label{font-weight:500}
.setting .hint{grid-column:1/-1}
.setting input[type="number"]{width:84px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:right}
.switch{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.switch:checked{background:var(--ok)}
.switch:checked::after{left:21px}

/* Почему так */
.why{display:flex;flex-direction:column;gap:12px}
.why-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.why-card .p{font-size:13px;color:var(--bad);font-weight:600}
.why-card .src{font-size:12px;color:var(--muted)}
.why-card .s{font-size:14.5px}
.why-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.why-head h2{font-size:15px}
details.why-inline{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
details.why-inline summary{cursor:pointer;font-weight:600}
details.why-inline[open] summary{margin-bottom:10px}
details.why-inline .why-card{border:0;padding:10px 0;border-top:1px solid var(--line);border-radius:0}
.whyblock{border-left:4px solid var(--accent)}
.sol{display:grid;gap:10px}
.future{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.future li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start}
.future li::before{content:"";width:10px;height:10px;margin-top:7px;border-radius:3px;background:var(--parent)}

/* Окно формы */
.sheet{position:fixed;inset:0;z-index:20;display:grid;align-items:end;justify-items:center}
.sheet-back{position:absolute;inset:0;background:#0b0e2299}
.sheet-card{position:relative;width:min(520px,100%);max-height:88vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .22s ease}
@media (min-width:640px){.sheet{align-items:center}.sheet-card{border-radius:20px}}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.sheet-card h2{font-size:18px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label,.lbl{font-size:13px;font-weight:600}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end}
.err{color:var(--bad);font-size:13px;min-height:1px}
.err:empty{display:none}
.rate{display:flex;flex-direction:column;gap:4px}
.stars-in{display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:2px}
.stars-in label{font-size:34px;line-height:1;color:var(--line);cursor:pointer;padding:0 2px;position:relative}
.stars-in input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.stars-in label:has(input:checked),.stars-in label:has(input:checked)~label{color:var(--warn)}
.stars-in label:has(input:focus-visible){outline:3px solid var(--parent);border-radius:6px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);cursor:pointer;font-weight:500}
.opt:has(input:checked){border-color:var(--ok);background:var(--rel-soft)}

<script>
(function(){

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('ru-RU');
function pl(n,a,b,c){n=Math.abs(Math.round(n));const m=n%100,k=n%10;if(m>10&&m<20)return c;if(k===1)return a;if(k>=2&&k<=4)return b;return c}
const rub=n=>fmt(n)+' ₽';
const dec=x=>String(Math.round(x*10)/10).replace('.',',');
const hrs=h=>h<1?Math.round(h*60)+' мин':dec(h)+' ч';
const hm=h=>{const m=Math.round(h*60);return Math.floor(m/60)+':'+String(m%60).padStart(2,'0')};
const sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
function ago(t){const d=Math.round((sod(Date.now())-sod(t))/DAY);return d<=0?'сегодня':d===1?'вчера':d+' '+pl(d,'день','дня','дней')+' назад'}
const dstr=t=>new Date(t).toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
function dayLabel(t){const d=Math.round((sod(t)-sod(Date.now()))/DAY);return d===0?'сегодня':d===1?'завтра':d===-1?'вчера':dstr(t)}
const uid=()=>Math.random().toString(36).slice(2,9);
const ICON_PHONE='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>';
const ICON_EYE='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 5C6.5 5 2.7 9.4 1.5 12c1.2 2.6 5 7 10.5 7s9.3-4.4 10.5-7C21.3 9.4 17.5 5 12 5zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm0-2a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg>';

/* ---------- Справочники ---------- */
const CATS={pets:'Животные',tech:'Телефон и техника',plants:'Цветы и растения',errands:'Покупки до двери',home:'Помощь по дому'};

const PLACES={street:'на улице',door:'до двери',inside:'в квартире'};
const PLACE_LONG={street:'На улице или у подъезда',door:'До двери квартиры, внутрь не заходить',inside:'Внутри квартиры'};
const DURS=[[0.25,'15 минут'],[0.5,'30 минут'],[1,'1 час'],[1.5,'1,5 часа'],[2,'2 часа'],[3,'3 часа']];
const TPL=[['Выгулять собаку','pets',0.5,'08:00','street',300],['Помочь с телефоном','tech',1,'17:00','inside',300],['Полить цветы','plants',0.25,'16:00','inside',150],['Занести покупки до двери','errands',0.25,'18:00','door',200],['Помочь разобрать вещи','home',1,'15:00','inside',300]];
const REV=['Пришёл вовремя','Всё аккуратно','Объяснил понятно','Вежливый и спокойный'];

/* ---------- Пример: Света, Кирилл и круг доверия ---------- */
function seed(){
  const n=Date.now(),d0=sod(n);
  const J=o=>Object.assign({msgs:[],deal:null,every:1,days:1,place:'street',final:null,review:null,paid:null,alloc:null,t:n},o);
  const sys=text=>({by:'sys',text});
  return {
    v:1,
    parent:{id:'sveta',name:'Света',phone:'+7 9•• •••-12-34'},
    teen:{id:'kirill',name:'Кирилл',age:15},
    circle:[
      {id:'nina',name:'Нина Ивановна',age:71,kin:'соседка',rel:'соседка с 5 этажа',status:'in',since:n-46*DAY},
      {id:'oleg',name:'Дядя Олег',kin:'родственник',rel:'брат Светы',status:'in',since:n-60*DAY},
      {id:'tanya',name:'Татьяна Петровна',kin:'соседка',rel:'соседка из 12-й квартиры',status:'invited',since:n-DAY,link:'https://ladno.example/krug/t7k2m'}],
    rules:{ver:2,end:20,day:2,week:8,rate:250,rounds:2,cats:{pets:true,tech:true,plants:true,errands:true,home:true},signed:{sveta:true,kirill:true}},
    goal:{title:'Наушники',price:8000,saves:[
      {amt:2500,t:n-40*DAY,note:'накопил раньше'},{amt:600,t:n-18*DAY,job:'h4'},{amt:600,t:n-12*DAY,job:'h1'},{amt:300,t:n-9*DAY,job:'h2'},{amt:250,t:n-6*DAY,job:'h3'}]},
    jobs:[
      J({id:'j4',title:'Занести продукты на 5 этаж',by:'nina',cat:'errands',from:d0+DAY,start:18,dur:.25,place:'door',price:200,status:'review',t:n-40*60e3,msgs:[{by:'nina',text:'Привезут доставкой к подъезду, а лифт не работает.'}]}),
      J({id:'j5',title:'Помочь собрать шкаф',by:'oleg',cat:'home',from:d0+3*DAY,start:19,dur:2,place:'inside',price:800,status:'review',t:n-2*H,msgs:[{by:'oleg',text:'Инструмент мой, Кирилл держит и подаёт детали.'}]}),
      J({id:'j1',title:'Выгулять собаку утром, неделя',by:'oleg',cat:'pets',from:d0+DAY,days:7,start:7.5,dur:.5,price:1500,status:'open',t:n-5*H,msgs:[{by:'oleg',text:'Рекс спокойный. Поводок и ключ от подъезда передам через Свету.'},sys('Света одобрила задание')]}),
      J({id:'j2',title:'Помочь настроить телефон',by:'nina',cat:'tech',from:d0+2*DAY,start:17,dur:1,place:'inside',price:300,status:'deal',deal:'open',t:n-26*H,msgs:[sys('Света одобрила задание'),{by:'kirill',price:500,text:'Там ещё перенести контакты и поставить мессенджер, это на час'},{by:'nina',price:400,text:'Давай 400, а пирожки бесплатно'}]}),
      J({id:'j3',title:'Полить цветы, пока я в отпуске',by:'nina',cat:'plants',from:d0+5*DAY,days:5,every:2,start:16,dur:.25,place:'inside',price:700,status:'open',t:n-30*H,msgs:[{by:'nina',text:'Ключи оставлю Свете. Фикус любит много воды, кактусы не трогать.'},sys('Света одобрила задание')]}),
      J({id:'j7',title:'Сфотографировать вещи для объявлений',by:'oleg',cat:'tech',from:d0+DAY,start:16,dur:1,place:'inside',price:350,final:350,status:'taken',t:n-2*DAY,msgs:[sys('Света одобрила задание'),sys('Кирилл взял задание за 350 ₽')]}),
      J({id:'j6',title:'Перенести фото внуков на флешку',by:'nina',cat:'tech',from:d0-DAY,start:17,dur:.5,place:'inside',price:200,final:200,status:'done',t:n-3*DAY,tDone:n-20*H,msgs:[sys('Света одобрила задание'),sys('Кирилл взял задание за 200 ₽'),{by:'kirill',text:'Готово! Все фото на флешке, в папке «Внуки».'}]}),
      J({id:'h3',title:'Вынести старые журналы в макулатуру',by:'nina',cat:'errands',from:d0-6*DAY,start:18,dur:.5,place:'door',price:250,final:250,status:'paid',t:n-8*DAY,tDone:n-6*DAY,review:{stars:4,text:'Всё хорошо, но опоздал на 15 минут',t:n-6*DAY},paid:{how:'cash',t:n-6*DAY},alloc:250}),
      J({id:'h2',title:'Настроить видеозвонки с внуками',by:'nina',cat:'tech',from:d0-9*DAY,start:17,dur:1,place:'inside',price:300,final:300,status:'paid',t:n-11*DAY,tDone:n-9*DAY,review:{stars:5,text:'Объяснил терпеливо и записал мне всё на листочек',t:n-9*DAY},paid:{how:'cash',t:n-9*DAY},alloc:300}),
      J({id:'h1',title:'Погулять с Рексом в выходные',by:'oleg',cat:'pets',from:d0-13*DAY,days:2,start:9,dur:1,price:600,final:600,status:'paid',t:n-15*DAY,tDone:n-12*DAY,review:{stars:5,text:'Рекс доволен, всё строго по времени',t:n-12*DAY},paid:{how:'card',t:n-12*DAY},alloc:600}),
      J({id:'h4',title:'Помочь покрасить забор на даче',by:'oleg',cat:'home',from:d0-19*DAY,days:2,start:11,dur:2,price:1200,final:1200,status:'paid',t:n-21*DAY,tDone:n-18*DAY,review:{stars:5,text:'Работал наравне со мной, молодец',t:n-18*DAY},paid:{how:'card',t:n-18*DAY},alloc:600})],
    log:[
      {id:uid(),t:n-40*60e3,text:'Нина Ивановна предложила задание «Занести продукты на 5 этаж»',job:'j4'},
      {id:uid(),t:n-2*H,text:'Дядя Олег предложил задание «Помочь собрать шкаф»',job:'j5'},
      {id:uid(),t:n-20*H,text:'Кирилл отметил: «Перенести фото внуков на флешку» сделано',job:'j6'},
      {id:uid(),t:n-DAY,text:'Света пригласила в круг Татьяну Петровну',kind:'circle'},
      {id:uid(),t:n-6*DAY,text:'Нина Ивановна отметила оплату: 250 ₽ наличными',job:'h3'},
      {id:uid(),t:n-9*DAY,text:'Нина Ивановна отметила оплату: 300 ₽ наличными',job:'h2'},
      {id:uid(),t:n-12*DAY,text:'Дядя Олег отметил оплату: 600 ₽ на карту Кирилла',job:'h1'},
      {id:uid(),t:n-18*DAY,text:'Дядя Олег отметил оплату: 1 200 ₽ на карту Кирилла',job:'h4'},
      {id:uid(),t:n-25*DAY,text:'Света и Кирилл подписали правила, версия 2',kind:'rules'},
      {id:uid(),t:n-46*DAY,text:'Нина Ивановна вошла в круг доверия',kind:'circle'},
      {id:uid(),t:n-60*DAY,text:'Света создала круг доверия и дала согласие на данные Кирилла',kind:'rules'}]
  };
}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1&&s.jobs&&s.rules&&s.circle)return s}catch(e){}return null}
let S=load()||seed();
let UI={role:'kirill',tab:'work'};
try{Object.assign(UI,JSON.parse(localStorage.getItem(UIKEY))||{})}catch(e){}
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(UIKEY,JSON.stringify(UI))}catch(e){}
  const el=$('#saved');el.textContent='Сохранено';el.classList.add('flash');clearTimeout(persist.t);persist.t=setTimeout(()=>el.classList.remove('flash'),900);
}
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2800)}
function commit(msg){persist();render();if(msg)toast(msg)}

/* ---------- Помощники ---------- */
const kindOf=r=>r==='sveta'?'parent':r==='kirill'?'teen':'client';
const K=()=>kindOf(UI.role);
const member=id=>S.circle.find(m=>m.id===id);
function pname(id){if(id==='sveta')return S.parent.name;if(id==='kirill')return S.teen.name;const m=member(id);return m?m.name:'Участник круга'}
const job=id=>S.jobs.find(j=>j.id===id);
const hoursOf=j=>j.dur*j.days;
const perHour=(p,j)=>p/Math.max(.25,hoursOf(j));
const weekLoad=j=>j.dur*Math.min(j.days,Math.ceil(7/j.every));
const weekUsed=()=>S.jobs.filter(j=>j.status==='taken').reduce((s,j)=>s+weekLoad(j),0);
const priceOf=j=>j.final!=null?j.final:j.price;
const allSigned=()=>S.rules.signed.sveta&&S.rules.signed.kirill;
const offers=j=>j.msgs.filter(m=>m.price!=null);
const lastOffer=j=>{const o=offers(j);return o[o.length-1]};
const dealTurn=j=>lastOffer(j).by==='kirill'?'client':'teen';
const maxOffers=()=>S.rules.rounds*2-1;
const goalSaved=()=>S.goal.saves.reduce((s,x)=>s+x.amt,0);
function addLog(text,o){S.log.unshift(Object.assign({id:uid(),t:Date.now(),text},o||{}))}
function sys(j,text){j.msgs.push({by:'sys',text,t:Date.now()})}
function empty(m){return `<p class="empty">${m}</p>`}
function avgRate(){const p=S.jobs.filter(j=>j.status==='paid'),h=p.reduce((s,j)=>s+hoursOf(j),0);return h?p.reduce((s,j)=>s+j.final,0)/h:0}
const minPrice=j=>Math.max(50,Math.ceil(S.rules.rate*hoursOf(j)/50)*50);
function priceHint(j){const a=avgRate();return `Подсказка цены: по ставке из правил (${rub(S.rules.rate)} за час) — от ${rub(minPrice(j))}.`+(a?` В вашем круге платили в среднем ${rub(a)} за час.`:'')}
function whenText(j){if(j.days===1)return dayLabel(j.from);const last=j.from+(j.days-1)*j.every*DAY;return `${j.every===2?'через день, '+j.days+' '+pl(j.days,'раз','раза','раз'):'каждый день'}, ${dstr(j.from)} – ${dstr(last)}`}
function stars(n){const r=Math.round(n);return `<span class="stars" role="img" aria-label="Оценка ${dec(n)} из 5">${'★'.repeat(r)}<span class="off">${'★'.repeat(5-r)}</span></span>`}
function checks(j){
  const r=S.rules,end=j.start+j.dur,m=member(j.by),out=[],ph=perHour(j.price,j);
  out.push(m&&m.status==='in'?{l:'ok',t:`${m.name} — из круга доверия`}:{l:'bad',t:'Этого взрослого нет в круге доверия'});
  out.push(r.cats[j.cat]?{l:'ok',t:`Можно по правилам: ${CATS[j.cat].toLowerCase()}`}:{l:'bad',t:`«${CATS[j.cat]}» выключено в правилах`});
  out.push(j.start>=7&&end<=r.end?{l:'ok',t:`Время ${hm(j.start)}–${hm(end)}: с 7:00 до ${r.end}:00`}:{l:'bad',t:`Время ${hm(j.start)}–${hm(end)}: по правилам можно только с 7:00 до ${r.end}:00`});
  out.push(j.dur<=r.day?{l:'ok',t:`${hrs(j.dur)} в день: в учебный день можно до ${hrs(r.day)}`}:{l:'bad',t:`${hrs(j.dur)} в день: в учебный день можно не больше ${hrs(r.day)}`});
  out.push(ph>=r.rate?{l:'ok',t:`${rub(ph)} за час: не ниже ставки из правил (${rub(r.rate)})`}:{l:'warn',t:`${rub(ph)} за час: ниже ставки из правил (${rub(r.rate)})`});
  if(j.place==='inside')out.push({l:'warn',t:'Внутри квартиры: вы будете знать адрес и время'});
  return out;
}
const blocked=j=>checks(j).some(c=>c.l==='bad');
function canTake(j){
  if(!allSigned())return 'Сначала вы с мамой подписываете новую версию правил.';
  if(blocked(j))return 'Задание не подходит под нынешние правила. Мама уже видит это.';
  const L=weekUsed();if(L+weekLoad(j)>S.rules.week)return `Не влезает в лимит недели: занято ${hrs(L)} из ${hrs(S.rules.week)}, а это задание — ${hrs(weekLoad(j))} в неделю.`;
  return '';
}
function statusPill(j){
  const k=K(),cl=k==='client';
  const M={review:['wait',cl?'у Светы на проверке':'ждёт одобрения мамы'],open:['',cl?'Кирилл ещё не взял':'можно взять'],deal:['hot','торг'],taken:['wait','в работе'],done:['warn','ждёт подтверждения'],confirmed:['warn','ждёт оплаты'],paid:['ok','оплачено'],declined:['bad','не одобрено'],cancelled:['bad','отменено']};
  const p=M[j.status];return p?`<span class="pill ${p[0]}">${p[1]}</span>`:'';
}
function jobMain(j,withStatus){
  const end=j.start+j.dur,p=priceOf(j),who=K()==='client'?'':esc(pname(j.by))+' · ';
  return `<div class="task"><div class="task-main"><div class="task-title">${esc(j.title)}</div><div class="task-meta">${who}${esc(whenText(j))} · ${hm(j.start)}–${hm(end)}</div>
  <div class="tags"><span class="pill">${esc(CATS[j.cat])}</span><span class="pill">${PLACES[j.place]}</span>${j.days>1?`<span class="pill">всего ${hrs(hoursOf(j))}</span>`:''}${withStatus?statusPill(j):''}</div></div>
  <div class="task-side"><div class="task-pts num">${rub(p)}</div><span class="small muted num">${rub(perHour(p,j))}/ч</span></div></div>`;
}
function threadHtml(j){
  if(!j.msgs.length)return '';
  const li=j.msgs.map(m=>{
    if(m.by==='sys')return `<li class="by-sys">${esc(m.text)}</li>`;
    const cls=m.by==='kirill'?'by-teen':m.by==='sveta'?'by-parent':'by-client';
    return `<li class="${cls}"><span class="who">${esc(pname(m.by))}</span>${m.price!=null?`<b class="num">${rub(m.price)}</b>${m.text?' — ':''}`:''}${esc(m.text)}</li>`}).join('');
  return `<ul class="thread">${li}</ul>${K()==='parent'?'':`<p class="seen">${ICON_EYE}Света видит эту переписку</p>`}`;
}
function dealFoot(j){
  if(j.deal!=='open')return '';
  const vk=K(),turn=dealTurn(j),last=lastOffer(j),n=offers(j).length,can=n<maxOffers();
  if(vk==='parent')return `<p class="hint">Ход ${n} из ${maxOffers()}. Ждём ответа: ${turn==='teen'?'Кирилл':esc(pname(j.by))}.</p>`;
  if(vk!==turn)return `<p class="hint">Ждём ответа: ${turn==='teen'?'Кирилл':esc(pname(j.by))}. Ход ${n} из ${maxOffers()}.</p>`;
  const why=vk==='teen'?canTake(j):'';
  return `${why?`<p class="warnline">${esc(why)}</p>`:''}<div class="row"><button class="btn sm primary" data-act="dAccept" data-id="${j.id}" ${why?'disabled':''}>${vk==='teen'?'Согласен на':'Принять'} ${rub(last.price)}</button>${can?`<button class="btn sm" data-act="dCounter" data-id="${j.id}">Своя цена</button>`:''}<button class="btn sm ghost" data-act="dDecline" data-id="${j.id}">${vk==='teen'?'Отказаться':'Оставить '+rub(j.price)}</button></div>
  ${!can&&vk==='client'?'<p class="hint">Это последнее предложение: по правилам последнее слово за вами.</p>':''}`;
}
function signBanner(who){
  if(S.rules.signed[who])return '';
  return `<div class="banner gold"><span>Правила изменились (версия ${S.rules.ver}). ${who==='kirill'?'Прочитай и подпиши. Пока оба не подпишут, новые задания брать нельзя.':'Подпишите новую версию.'}</span><button class="btn sm" data-act="tab" data-tab="rules">Открыть</button></div>`;
}
function weekBar(){
  const L=weekUsed(),w=S.rules.week,r=L/w;
  return `<div class="bar-top"><span>Занято на неделе</span><span class="num muted">${hrs(L)} из ${hrs(w)}</span></div><div class="bar" role="img" aria-label="Занято ${dec(L)} из ${dec(w)} часов"><i class="${r>1?'over':''}" style="width:${Math.min(100,r*100).toFixed(1)}%"></i></div>`;
}
function moneyWhy(forTeen){
  return `<section class="block whyblock"><p class="eyebrow">Почему так</p><h2>${forTeen?'Деньги приходят тебе, а не в приложение':'Оплата — не через приложение'}</h2>
  <p class="small">${forTeen?'Заказчик платит тебе сам: наличными или на твою карту. Ладно деньги не хранит и не переводит, а только записывает «Оплачено». С 14 лет свой заработок ты тратишь и копишь сам.':'Вы платите Кириллу сами, как привыкли: наличными или переводом на его карту. Ладно деньги не хранит и не переводит, а только записывает «Оплачено».'}</p>
  <p class="small">Так приложению не нужна банковская лицензия, и не возникает сложностей с платежами несовершеннолетним. По исследованию, реальные деньги детям в России сейчас идут только через банки.</p>
  <p class="src">Исследование «Семейная мотивация и единые сервисы», 24.10.2026 · ст. 26 ГК РФ: с 14 лет подросток сам распоряжается заработком (по Большой российской энциклопедии)</p></section>`;
}

TV.earn=()=>{

  ${toAlloc.map(j=>`<div class="banner gold"><span>«${esc(j.title)}»: оплачено ${rub(j.final)} ${j.paid.how==='cash'?'наличными':'на карту'}. Отложить на «${esc(g.title)}»?</span><span class="row"><button class="btn sm accent" data-act="alloc" data-id="${j.id}" data-part="all">Всё</button><button class="btn sm" data-act="alloc" data-id="${j.id}" data-part="half">Половину</button><button class="btn sm ghost" data-act="alloc" data-id="${j.id}" data-part="none">Не сейчас</button></span></div>`).join('')}

    <div class="meter" role="img" aria-label="Собрано ${Math.floor(p*100)} процентов"><i style="width:${(p*100).toFixed(1)}%"></i></div>
    <p class="small muted">${Math.floor(p*100)}% · ${pace}</p>

  <section class="block"><h2>История</h2><ul class="list">${hist.map(j=>`<li><span>${esc(j.title)}<br><span class="d">${esc(pname(j.by))} · ${dstr(j.tDone||j.t)}${j.alloc?` · отложено ${rub(j.alloc)}`:''}</span></span><span class="right"><span class="plus">+${fmt(j.final)} ₽</span>${statusPill(j)}</span></li>`).join('')||'<li>'+empty('Пока ничего не сделано.')+'</li>'}</ul></section>

};
function resumeData(){
  const fin=S.jobs.filter(j=>j.status==='paid'||j.status==='confirmed'),rv=fin.filter(j=>j.review);
  const avg=rv.length?rv.reduce((s,j)=>s+j.review.stars,0)/rv.length:0,hours=fin.reduce((s,j)=>s+hoursOf(j),0);
  const byCat={};fin.forEach(j=>(byCat[j.cat]=byCat[j.cat]||[]).push(j));
  const cats=Object.keys(byCat).sort((a,b)=>byCat[b].length-byCat[a].length);
  return {fin,rv,avg,hours,byCat,cats,clients:new Set(fin.map(j=>j.by)).size};
}

const fld=(id,label,input)=>`<div class="fld"><label for="${id}">${label}</label>${input}</div>`;

const parseTime=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(String(s||'').trim());if(!m)return NaN;const h=+m[1],mi=+m[2];return h<24&&mi<60?h+mi/60:NaN};
function formJob(){

  if(el.dataset&&el.dataset.cat){const c=el.dataset.cat;S.rules.cats[c]=el.checked;bump(`«${CATS[c]}» — ${el.checked?'можно':'нельзя'}`);return}
  const key=el.dataset&&el.dataset.set;if(!key)return;
  const v=Number(String(el.value).replace(',','.')),mn=+el.dataset.min,mx=+el.dataset.max,st=+el.dataset.step||1;
  if(!Number.isFinite(v)||v<mn||v>mx||Math.abs(v/st-Math.round(v/st))>1e-6){el.value=S.rules[key];toast(`Нужно число от ${dec(mn)} до ${dec(mx)}${st!==1?', с шагом '+dec(st):''}`);return}
  if(S.rules[key]===v)return;
  S.rules[key]=v;bump(`«${el.closest('.setting').querySelector('label').textContent}» = ${dec(v)}`);
});
function bump(what){S.rules.ver++;S.rules.signed={sveta:false,kirill:false};addLog(`Света изменила правила: ${what}. Версия ${S.rules.ver} ждёт подписей`,{kind:'rules'});commit('Новая версия правил. Её подписываете вы оба')}
function copyText(txt,okMsg){try{navigator.clipboard.writeText(txt).then(()=>toast(okMsg),()=>toast('Не получилось скопировать: выделите текст вручную'))}catch(e){toast('Не получилось скопировать: выделите текст вручную')}}
function cvText(){
  const R=resumeData();
  return `${S.teen.name}, ${S.teen.age} лет\nОпыт подработки: ${R.fin.length} ${pl(R.fin.length,'задание','задания','заданий')}, ${dec(R.hours)} ч. Задания от знакомых взрослых, с согласия родителя.\n`+
    R.cats.map(c=>`— ${CATS[c]}: ${R.byCat[c].map(j=>j.title).join('; ')}`).join('\n')+
    (R.avg?`\nСредняя оценка: ${dec(R.avg)} из 5 (${R.rv.length} ${pl(R.rv.length,'отзыв','отзыва','отзывов')}).`:'')+
    (R.rv.length?'\nОтзывы:\n'+R.rv.map(j=>`«${j.review.text}» — ${pname(j.by)}${kinOf(j.by)?' ('+kinOf(j.by)+')':''}`).join('\n'):'')+
    (R.cats.length?`\nСильные стороны: ${R.cats.map(c=>SKILL[c].toLowerCase()).join(', ')}.`:'');
}

/* ---------- Действия ---------- */
function priceSheet(j,title,cur,byId,onDone){
  const r50=x=>Math.max(50,Math.round(x/50)*50),mine=offers(j).filter(o=>o.by===byId),prev=mine.length?mine[mine.length-1].price:null;
  let def=prev!=null?r50((prev+cur)/2):byId==='kirill'?Math.max(cur+50,minPrice(j)):r50((cur+j.price)/2);
  if(def===cur)def=byId==='kirill'?cur+50:Math.max(50,cur-50);
  sheet(title,`<p class="small">Сейчас на столе: <b>${rub(cur)}</b>.</p>`+fld('f-price','Своя цена, ₽',numIn('f-price','price',def,50,20000,50))+`<p class="hint">${priceHint(j)}</p>`+
    fld('f-note','Почему столько (по желанию)',`<input id="f-note" name="note" maxlength="100" placeholder="${byId==='kirill'?'Например: там больше работы, чем кажется':'Например: давай сойдёмся посередине'}">`)+'<p class="hint">Света видит весь торг.</p>',
    'Предложить',f=>{const v=int(f.price);if(!(v>=50&&v<=20000))return 'Цена: от 50 до 20 000 ₽.';if(v===cur)return 'Это та же цена. Лучше нажмите «Согласен» или «Принять».';
      j.msgs.push({by:byId,price:v,text:(f.note||'').trim(),t:Date.now()});j.deal='open';j.status='deal';addLog(`${pname(byId)} предлагает ${rub(v)} за «${j.title}»`,{job:j.id});onDone();});
}
function takeJob(j,v){j.final=v;j.status='taken';sys(j,`Кирилл взял задание за ${rub(v)}`);addLog(`Кирилл взял задание «${j.title}» за ${rub(v)}`,{job:j.id})}
const ACT={
  role:d=>{UI.role=d.role;if(UI.tab!=='solutions')UI.tab=TABS[kindOf(d.role)][0][0];commit();scrollTo(0,0)},
  tab:d=>{UI.tab=d.tab;commit();scrollTo(0,0)},
  solutions:()=>{UI.tab='solutions';commit();scrollTo(0,0)},
  goto:d=>{UI.role=d.role;UI.tab=d.tab;commit();scrollTo(0,0)},
  closeSheet,
  call:()=>toast(`Звоним маме: ${S.parent.name}, ${S.parent.phone}. В прототипе звонка нет`),
  /* подросток */
  take:d=>{const j=job(d.id),why=canTake(j);if(why){toast(why);return}takeJob(j,j.price);commit(`Задание твоё. ${pname(j.by)} и мама это видят`)},
  counter:d=>{const j=job(d.id);if(canTake(j)){toast(canTake(j));return}priceSheet(j,'Своя цена',j.price,'kirill',()=>commit(`Предложение отправлено: ${pname(j.by)} ответит`))},
  done:d=>{const j=job(d.id);sheet('Сделал: '+j.title,fld('f-note','Как прошло (по желанию)',`<input id="f-note" name="note" maxlength="120" placeholder="Например: Рекс гулял 30 минут, всё хорошо">`)+`<p class="hint">${esc(pname(j.by))} проверит работу и оставит отзыв. Потом заплатит тебе сам.</p>`,'Отправить',f=>{
    const t=(f.note||'').trim();if(t)j.msgs.push({by:'kirill',text:t,t:Date.now()});sys(j,'Кирилл отметил: сделано');j.status='done';j.tDone=Date.now();addLog(`Кирилл отметил: «${j.title}» сделано`,{job:j.id});commit(`Отправлено: ${pname(j.by)} подтвердит`)})},
  alloc:d=>{const j=job(d.id),a=d.part==='all'?j.final:d.part==='half'?Math.round(j.final/2):0;j.alloc=a;if(a)S.goal.saves.push({amt:a,t:Date.now(),job:j.id});commit(a?`+${rub(a)} на «${S.goal.title}»`:'Хорошо, без откладывания')},
  saveMore:()=>sheet('Отложил на цель',fld('f-amt','Сколько, ₽',numIn('f-amt','amt',500,1,1000000))+'<p class="hint">Деньги лежат у тебя: на карте или в копилке. Здесь только запись, чтобы видеть прогресс.</p>','Записать',f=>{const a=int(f.amt);if(!(a>=1&&a<=1000000))return 'Сумма: от 1 до 1 000 000 ₽.';S.goal.saves.push({amt:a,t:Date.now()});commit(`+${rub(a)} на «${S.goal.title}»`)}),
  editGoal:()=>sheet('Моя цель',fld('f-title','Цель',`<input id="f-title" name="title" maxlength="40" value="${esc(S.goal.title)}">`)+fld('f-price','Сколько стоит, ₽',numIn('f-price','price',S.goal.price,100,1000000)),'Сохранить',f=>{const t=(f.title||'').trim(),p=int(f.price);if(!t)return 'Напиши цель.';if(!(p>=100&&p<=1000000))return 'Цена: от 100 до 1 000 000 ₽.';S.goal.title=t;S.goal.price=p;commit('Цель сохранена')}),
  cvCopy:()=>{const txt=cvText();sheet('Резюме для hh.ru',`<textarea id="f-cv" readonly rows="12" style="width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;font-size:13.5px">${esc(txt)}</textarea><p class="hint">Вставьте этот текст в раздел «Опыт» или «О себе». Фамилию и контакты добавьте сами.</p>`,'Скопировать',()=>{copyText(txt,'Резюме скопировано')})},
  sign:d=>{S.rules.signed[d.who]=true;addLog(`${pname(d.who)} ${d.who==='sveta'?'подписала':'подписал'} правила, версия ${S.rules.ver}`,{kind:'rules'});commit(allSigned()?'Подписано. Правила действуют':'Подписано. Ждём вторую подпись')},
  /* торг: подросток и заказчик */
  dAccept:d=>{const j=job(d.id),v=lastOffer(j).price,why=canTake(j);if(why){toast(K()==='teen'?why:'Кирилл сейчас не может взять задание: '+why);return}
    j.deal='agreed';sys(j,`Договорились: ${rub(v)}`);takeJob(j,v);commit(`Договорились на ${rub(v)}. Записано в историю`)},
  dCounter:d=>{const j=job(d.id),by=K()==='teen'?'kirill':j.by;priceSheet(j,'Своя цена',lastOffer(j).price,by,()=>commit('Встречное предложение отправлено'))},
  dDecline:d=>{const j=job(d.id);j.deal='declined';j.status='open';
    sys(j,K()==='teen'?`Кирилл отказался от торга. Цена осталась ${rub(j.price)}`:`${pname(j.by)} оставляет свою цену: ${rub(j.price)}`);addLog(`Торг о «${j.title}» закончился без изменения цены`,{job:j.id});commit('Цена осталась прежней')},
  /* заказчик */
  newJob:()=>{
    const r=S.rules,d0=sod(Date.now());
    sheet('Новое задание',`<div class="row">${TPL.map((t,i)=>`<button type="button" class="chip" data-act="tpl" data-i="${i}">${esc(t[0])}</button>`).join('')}</div>`+
      fld('f-title','Что нужно сделать',`<input id="f-title" name="title" maxlength="60" placeholder="Например: занести покупки">`)+
      fld('f-cat','Какая помощь',`<select id="f-cat" name="cat">${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>`)+
      `<div class="grid2">${fld('f-day','Когда',`<select id="f-day" name="day">${Array.from({length:8},(_,k)=>`<option value="${k}" ${k===1?'selected':''}>${k===0?'Сегодня':k===1?'Завтра':dstr(d0+k*DAY)}</option>`).join('')}</select>`)}${fld('f-start','Во сколько',`<input id="f-start" name="start" type="time" value="17:00" step="900">`)}</div>`+
      `<div class="grid2">${fld('f-dur','Сколько займёт',`<select id="f-dur" name="dur">${DURS.map(([v,l])=>`<option value="${v}" ${v===.5?'selected':''}>${l}</option>`).join('')}</select>`)}${fld('f-days','Сколько раз',numIn('f-days','days',1,1,14))}</div>`+
      fld('f-every','Если несколько раз',`<select id="f-every" name="every"><option value="1">каждый день</option><option value="2">через день</option></select>`)+
      fld('f-place','Где',`<select id="f-place" name="place">${Object.entries(PLACE_LONG).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>`)+
      fld('f-price','Сколько заплатите, ₽',numIn('f-price','price',250,50,20000,50))+
      `<p class="hint" id="f-hint"></p><ul class="rcheck" id="f-check" aria-live="polite"></ul>`+
      fld('f-note','Пояснение для Кирилла (по желанию)',`<input id="f-note" name="note" maxlength="120" placeholder="Например: ключи у Светы">`)+
      `<p class="hint">Сначала задание посмотрит Света, мама Кирилла. Кирилл увидит его после её одобрения. Платите вы сами, приложение деньги не трогает.</p>`,
      'Отправить Свете',f=>{
        const title=(f.title||'').trim(),j=formJob();
        if(!title)return 'Напишите, что нужно сделать.';
        if(!Number.isFinite(j.start))return 'Укажите время, например 17:00.';
        if(!(j.price>=50&&j.price<=20000))return 'Цена: от 50 до 20 000 ₽.';
        const nj=Object.assign({id:uid(),title,from:d0+(int(f.day)||0)*DAY,status:'review',msgs:[],deal:null,final:null,review:null,paid:null,alloc:null,t:Date.now()},j);
        if(nj.days===1)nj.every=1;
        const note=(f.note||'').trim();if(note)nj.msgs.push({by:UI.role,text:note,t:Date.now()});
        S.jobs.unshift(nj);addLog(`${pname(UI.role)} предложила задание «${title}»`,{job:nj.id});
        commit('Отправлено Свете на проверку. Кирилл увидит задание после её одобрения');
      });
    formCheck();
  },
  tpl:d=>{const t=TPL[+d.i];$('#f-title').value=t[0];$('#f-cat').value=t[1];$('#f-dur').value=String(t[2]);$('#f-start').value=t[3];$('#f-place').value=t[4];$('#f-price').value=t[5];formCheck()},
  confirm:d=>{const j=job(d.id);
    sheet('Принять работу',`<p class="small">${esc(j.title)} · Кирилл · ${rub(j.final)}</p>
      <div class="rate"><span class="lbl">Оценка</span><div class="stars-in" role="radiogroup" aria-label="Оценка">${[5,4,3,2,1].map(v=>`<label><input type="radio" name="stars" value="${v}" ${v===5?'checked':''} aria-label="${v} из 5"><span aria-hidden="true">★</span></label>`).join('')}</div><span class="hint" id="f-stars-l">5 из 5</span></div>
      <div class="row">${REV.map(c=>`<button type="button" class="chip" data-act="revChip" data-t="${esc(c)}">${esc(c)}</button>`).join('')}</div>`+
      fld('f-rev','Короткий отзыв',`<textarea id="f-rev" name="text" rows="2" maxlength="140" placeholder="Например: пришёл вовремя, всё аккуратно"></textarea>`)+
      '<p class="hint">Отзыв попадёт в резюме Кирилла. Там будет только ваше имя, без фамилии и адреса.</p>','Принять работу',f=>{
        const s=int(f.stars),t=(f.text||'').trim();if(!(s>=1&&s<=5))return 'Поставьте оценку.';if(t.length<2)return 'Напишите пару слов: это первый опыт Кирилла.';
        j.review={stars:s,text:t,t:Date.now()};j.status='confirmed';sys(j,`${pname(j.by)} приняла работу: ${s} из 5`);addLog(`${pname(j.by)} приняла «${j.title}» и оставила отзыв`,{job:j.id});commit('Спасибо! Теперь заплатите Кириллу и отметьте оплату')})},
  revChip:d=>{const ta=$('#f-rev');ta.value=(ta.value.trim()?ta.value.trim().replace(/[.!]?$/,'. '):'')+d.t;ta.focus()},
  ret:d=>{const j=job(d.id);sheet('Нужно доделать',fld('f-note','Что поправить',`<input id="f-note" name="note" maxlength="100" placeholder="Например: полить ещё цветы на кухне">`)+'<p class="hint">Кирилл увидит пояснение и доделает. Света тоже его видит.</p>','Вернуть',f=>{const t=(f.note||'').trim();if(!t)return 'Напишите, что поправить.';j.msgs.push({by:j.by,text:t,t:Date.now()});j.status='taken';addLog(`«${j.title}»: нужно доделать`,{job:j.id});commit('Вернули Кириллу с пояснением')})},
  pay:d=>{const j=job(d.id);
    sheet('Отметить оплату',`<p class="small">${esc(j.title)}: <b>${rub(j.final)}</b> Кириллу.</p><div class="opts" role="radiogroup" aria-label="Как оплатили"><label class="opt"><input type="radio" name="how" value="cash" checked>Наличными</label><label class="opt"><input type="radio" name="how" value="card">Переводом на карту Кирилла</label></div><p class="hint">Деньги вы отдаёте сами, как привыкли. Приложение их не видит и не хранит: здесь только отметка «Оплачено».</p>`,'Оплачено',f=>{
      const how=f.how==='card'?'card':'cash';j.paid={how,t:Date.now()};j.status='paid';j.alloc=null;sys(j,`Оплачено ${how==='cash'?'наличными':'на карту Кирилла'}: ${rub(j.final)}`);
      addLog(`${pname(j.by)} отметила оплату: ${rub(j.final)} ${how==='cash'?'наличными':'на карту Кирилла'}`,{job:j.id});commit('Записано: оплачено. Спасибо!')})},
  /* родитель */
  approve:d=>{const j=job(d.id);if(blocked(j)){toast('Задание нарушает правила');return}j.status='open';sys(j,'Света одобрила задание');addLog(`Света одобрила «${j.title}»`,{job:j.id});commit('Одобрено. Теперь Кирилл видит задание')},
  reject:d=>{const j=job(d.id),bad=checks(j).filter(c=>c.l==='bad').map(c=>c.t);
    sheet('Отклонить задание',`<p class="small">${esc(j.title)} · ${esc(pname(j.by))}</p>`+fld('f-note','Пояснение для заказчика',`<input id="f-note" name="note" maxlength="120" value="${esc(bad.length?'По нашим правилам: '+bad[0].toLowerCase():'')}" placeholder="Например: давайте лучше днём">`)+'<p class="hint">Пояснение увидит заказчик. Он сможет предложить задание заново, например в другое время.</p>','Отклонить',f=>{
      const t=(f.note||'').trim();if(!t)return 'Напишите пару слов, почему.';j.status='declined';j.reason=t;sys(j,'Света не одобрила: '+t);addLog(`Света отклонила «${j.title}»`,{job:j.id});commit('Отклонено, заказчик видит причину')})},
  invite:()=>sheet('Пригласить взрослого',fld('f-name','Как зовут',`<input id="f-name" name="name" maxlength="40" placeholder="Например: Ирина Сергеевна">`)+fld('f-kin','Кто это',`<select id="f-kin" name="kin"><option value="соседка">Соседка</option><option value="сосед">Сосед</option><option value="родственник">Родственник</option><option value="родственница">Родственница</option><option value="друг семьи">Друг семьи</option></select>`)+fld('f-rel','Подробнее (по желанию)',`<input id="f-rel" name="rel" maxlength="50" placeholder="Например: из 8-й квартиры">`)+fld('f-phone','Телефон',`<input id="f-phone" name="phone" type="tel" inputmode="tel" maxlength="20" placeholder="+7 900 000-00-00">`)+'<p class="hint">Приглашайте только тех, кого знаете лично. В настоящем приложении взрослый подтвердит этот номер кодом из СМС.</p>','Создать ссылку',f=>{
    const nm=(f.name||'').trim(),ph=(f.phone||'').replace(/\D/g,'');if(!nm)return 'Напишите, как зовут.';if(ph.length<10)return 'Нужен номер телефона: по нему человек подтвердит, что это он.';
    const m={id:uid(),name:nm,kin:f.kin,rel:((f.kin||'')+((f.rel||'').trim()?', '+f.rel.trim():'')),status:'invited',since:Date.now(),link:'https://ladno.example/krug/'+uid()};
    S.circle.push(m);addLog(`Света пригласила в круг: ${nm}`,{kind:'circle'});persist();render();
    sheet('Ссылка готова',`<p class="small">Отправьте ссылку ${esc(nm)} в мессенджере или СМС. Это пример: в прототипе ссылка не открывается.</p><div class="linkbox"><input readonly value="${esc(m.link)}" aria-label="Ссылка-приглашение"></div>`,'Скопировать',()=>{copyText(m.link,'Ссылка-пример скопирована')});}),
  copyLink:d=>{const m=member(d.id);copyText(m.link,'Ссылка-пример скопирована. В прототипе она не открывается')},
  inviteJoin:d=>{const m=member(d.id);m.status='in';m.since=Date.now();addLog(`${m.name} вошла в круг доверия`,{kind:'circle'});commit(`${m.name} теперь в круге и может предлагать задания`)},
  inviteCancel:d=>{S.circle=S.circle.filter(m=>m.id!==d.id);commit('Приглашение отменено')},
  removeMember:d=>{const m=member(d.id);sheet('Убрать из круга?',`<p class="small">${esc(m.name)} больше не сможет давать задания Кириллу. Открытые задания этого человека исчезнут у Кирилла. История и отзывы останутся.</p>`,'Убрать',()=>{
    m.status='removed';S.jobs.filter(j=>j.by===m.id&&['review','open','deal'].includes(j.status)).forEach(j=>{j.status='cancelled';j.reason='Человека убрали из круга доверия';sys(j,'Задание отменено: человека убрали из круга')});
    addLog(`Света убрала из круга: ${m.name}`,{kind:'circle'});commit('Убрано из круга')})},
  reset:()=>sheet('Вернуть пример к началу?','<p class="small">Все изменения в этом браузере пропадут, и пример начнётся заново.</p>','Вернуть',()=>{S=seed();UI={role:'sveta',tab:'rules'};commit('Пример восстановлен')})
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const fn=ACT[b.dataset.act];if(fn){e.preventDefault();fn(b.dataset,b)}});
render();
})();
</script>
